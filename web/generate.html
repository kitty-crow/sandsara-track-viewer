<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SVG to .bin | Sandsara Track Tools</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header">
    <a class="site-brand" href="./index.html">Sandsara Track Tools</a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="./vectorise.html">Image to SVG</a>
      <a href="./generate.html" aria-current="page">SVG to .bin</a>
      <a href="./visualise.html">View .bin</a>
    </nav>
  </header>
  <main class="site-main">
    <section class="upload-panel">
      <label for="svgInput">Upload an SVG</label>
      <input id="svgInput" type="file" accept="image/svg+xml,.svg">
      <p id="siteStatus" class="site-status">Starting track generator…</p>
    </section>
    <div id="app" aria-live="polite"></div>
    <p class="privacy-note">The generated route is previewed before download. Use the tool’s Save button to download the native Sandsara .bin file.</p>
  </main>
  <script type="module" src="./assets/site/generate.js"></script>
</body>
</html>
