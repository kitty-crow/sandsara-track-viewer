name: Apply concise names and outer-edge routing

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply routing and naming refactor
        shell: bash
        run: |
          cat > /tmp/apply-refactor.mjs.gz.b64 <<'B64'

B64
          base64 -d /tmp/apply-refactor.mjs.gz.b64 | gzip -d > /tmp/apply-refactor.mjs
          node /tmp/apply-refactor.mjs

      - name: Validate TypeScript and WebAssembly
        run: npm run compile

      - name: Verify outer-edge progress order and safe return
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const bytes = await readFile("build/router-wasm/path-router.wasm");
          const { instance } = await WebAssembly.instantiate(bytes, {
            env: { abort: () => { throw new Error("WASM abort"); } }
          });
          const w = instance.exports;
          const outer = [
            [-25000, -25000], [25000, -25000], [25000, 25000],
            [-25000, 25000], [-25000, -25000]
          ];
          const inner = [
            [-5000, -5000], [5000, -5000], [5000, 5000],
            [-5000, 5000], [-5000, -5000]
          ];
          const paths = [inner, outer];
          const pts = paths.flat();
          if (w.rCfg(paths.length, pts.length, 32767, 1) < 0) throw new Error("configure failed");
          let off = 0;
          for (let i = 0; i < paths.length; i++) {
            if (w.rSetPth(i, off, paths[i].length) < 0) throw new Error("set path failed");
            off += paths[i].length;
          }
          for (let i = 0; i < pts.length; i++) {
            if (w.rSetPt(i, pts[i][0], pts[i][1]) < 0) throw new Error("set point failed");
          }
          if (w.rBegin() < 0) throw new Error("begin failed");
          if (w.rStep() < 0) throw new Error("first step failed");
          const firstChunk = Array.from({ length: w.rOutCnt() }, (_, i) => [w.rOutX(i), w.rOutY(i)]);
          const firstMin = Math.min(...firstChunk.map(([x, y]) => Math.hypot(x, y)));
          if (firstMin < 20000) throw new Error(`first progress chunk reached the inner drawing: ${firstMin}`);
          while (!w.rDone()) {
            if (w.rStep() < 0) throw new Error("routing step failed");
          }
          const out = Array.from({ length: w.rOutCnt() }, (_, i) => [w.rOutX(i), w.rOutY(i)]);
          const start = out[0];
          const end = out.at(-1);
          if (!start || !end) throw new Error("empty route");
          if (Math.abs(Math.hypot(...start) - 32767) > 1) throw new Error("route does not start on the ring");
          if (Math.hypot(start[0] - end[0], start[1] - end[1]) > 1e-6) throw new Error("route does not retrace to its ring start");
          if (Math.min(...out.map(([x, y]) => Math.hypot(x, y))) > 8000) throw new Error("route never reached the inner drawing");
          NODE

      - name: Package the extension
        run: npm run package-extension

      - name: Commit validated source
        shell: bash
        run: |
          rm -f .github/workflows/apply-refactor.yml
          git config user.name "Kitty Crow"
          git config user.email "141717449+kitty-crow@users.noreply.github.com"
          git add -A
          git commit -m "Use concise names and fix outer-edge routing"
          git push origin HEAD:main
