name: Validate TypeScript builds

on:
  pull_request:
  push:
    branches-ignore:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        shell: bash
        run: |
          set +e
          npm run build:site > build.log 2>&1
          status=$?
          cat build.log
          exit "$status"

      - name: Validate generated extension and codec
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/extension.js
          test -s dist/webviews/imageVectoriser.js
          test -s dist/webviews/svgToTrack.js
          test -s dist/webviews/trackPreview.js
          test -s dist/site/index.html
          test -s dist/site/assets/site/vectorise.js
          test -s dist/site/assets/site/generate.js
          test -s dist/site/assets/site/visualise.js
          node --input-type=module <<'NODE'
          import {
            decodeSandsaraTrack,
            encodeSandsaraTrack
          } from "./dist/site/assets/sandsara.js";

          const source = [
            { x: 23169, y: -23169 },
            { x: -5, y: 2763 }
          ];
          const encoded = encodeSandsaraTrack(source);
          const decoded = decodeSandsaraTrack(encoded);

          if (encoded.byteLength !== 12 || decoded.points.length !== 2) {
            throw new Error("Sandsara codec round trip failed.");
          }
          if (encoded[2] !== 0x2c || encoded[5] !== 0x0a) {
            throw new Error("Sandsara separators were not encoded correctly.");
          }
          NODE

      - name: Install browser test driver
        run: python3 -m pip install --disable-pip-version-check playwright==1.54.0

      - name: Exercise complete browser workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python3 - <<'PY'
          import asyncio
          import shutil
          import struct
          import subprocess
          import tempfile
          import time
          from pathlib import Path

          from playwright.async_api import async_playwright

          ROOT = Path.cwd()
          SITE = ROOT / "dist" / "site"
          BUILD = ROOT / "build"
          PORT = 4173

          def make_bmp(path: Path) -> None:
              width = 180
              height = 180
              row_size = ((width * 3 + 3) // 4) * 4
              pixels = bytearray(row_size * height)

              def black(x: int, y: int) -> bool:
                  border = 24 <= x <= 155 and 24 <= y <= 155 and (
                      x < 31 or x > 148 or y < 31 or y > 148
                  )
                  diagonal_a = abs(y - x) <= 4 and 38 <= x <= 142
                  diagonal_b = abs(y - (179 - x)) <= 4 and 38 <= x <= 142
                  circle = abs((x - 90) ** 2 + (y - 90) ** 2 - 58 ** 2) < 420
                  return border or diagonal_a or diagonal_b or circle

              for y in range(height):
                  for x in range(width):
                      value = 0 if black(x, y) else 255
                      offset = (height - 1 - y) * row_size + x * 3
                      pixels[offset:offset + 3] = bytes((value, value, value))

              file_size = 54 + len(pixels)
              header = b"BM" + struct.pack("<IHHI", file_size, 0, 0, 54)
              dib = struct.pack(
                  "<IIIHHIIIIII",
                  40, width, height, 1, 24, 0, len(pixels), 2835, 2835, 0, 0
              )
              path.write_bytes(header + dib + pixels)

          async def run() -> None:
              browser_path = next(
                  (shutil.which(name) for name in (
                      "google-chrome",
                      "google-chrome-stable",
                      "chromium",
                      "chromium-browser"
                  ) if shutil.which(name) is not None),
                  None
              )
              if browser_path is None:
                  raise RuntimeError("No Chromium-compatible browser is installed on the runner.")

              temporary = Path(tempfile.mkdtemp(prefix="sandsara-site-smoke-"))
              image_path = temporary / "source.bmp"
              make_bmp(image_path)

              server = subprocess.Popen(
                  ["python3", "-m", "http.server", str(PORT), "--directory", str(SITE)],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              )

              try:
                  time.sleep(1)
                  async with async_playwright() as playwright:
                      browser = await playwright.chromium.launch(
                          headless=True,
                          executable_path=browser_path,
                          args=["--no-sandbox", "--disable-dev-shm-usage"]
                      )
                      context = await browser.new_context(
                          accept_downloads=True,
                          viewport={"width": 1440, "height": 1000}
                      )
                      page = await context.new_page()
                      errors: list[str] = []
                      page.on(
                          "console",
                          lambda message: errors.append(
                              f"console {message.type}: {message.text}"
                          ) if message.type == "error" else None
                      )
                      page.on("pageerror", lambda error: errors.append(f"page error: {error}"))

                      await page.goto(
                          f"http://127.0.0.1:{PORT}/index.html",
                          wait_until="networkidle"
                      )
                      if "Shape a line" not in await page.locator("h1").inner_text():
                          raise RuntimeError("The studio landing page did not render.")
                      await page.screenshot(path=str(BUILD / "site-desktop.png"), full_page=True)

                      await page.goto(
                          f"http://127.0.0.1:{PORT}/vectorise.html",
                          wait_until="networkidle"
                      )
                      await page.wait_for_function(
                          "document.querySelector('#siteStatus')?.textContent?.includes('Choose an image')"
                      )
                      await page.set_input_files("#imageInput", str(image_path))
                      await page.wait_for_function(
                          "!document.querySelector('#save')?.disabled && "
                          "document.querySelector('#stats')?.textContent?.includes('vector lines')",
                          timeout=30_000
                      )

                      async with page.expect_download() as svg_info:
                          await page.click("#save")
                      svg_download = await svg_info.value
                      svg_path = Path(await svg_download.path())
                      svg_text = svg_path.read_text(encoding="utf-8")
                      if "<svg" not in svg_text or "<path" not in svg_text:
                          raise RuntimeError("Image vectorisation did not produce SVG paths.")

                      await page.wait_for_selector("#continueLink:not([hidden])")
                      await page.click("#continueLink")
                      await page.wait_for_load_state("networkidle")
                      await page.wait_for_function(
                          "!document.querySelector('#save')?.disabled && "
                          "document.querySelector('#stats')?.textContent?.includes('Sandsara points')",
                          timeout=30_000
                      )

                      async with page.expect_download() as bin_info:
                          await page.click("#save")
                      bin_download = await bin_info.value
                      bin_path = Path(await bin_download.path())
                      binary = bin_path.read_bytes()
                      if len(binary) < 12 or len(binary) % 6 != 0:
                          raise RuntimeError("Generated Sandsara binary has an invalid size.")
                      if any(
                          binary[index + 2] != 0x2C or binary[index + 5] != 0x0A
                          for index in range(0, len(binary), 6)
                      ):
                          raise RuntimeError("Generated Sandsara binary has invalid records.")

                      await page.goto(
                          f"http://127.0.0.1:{PORT}/visualise.html",
                          wait_until="networkidle"
                      )
                      await page.wait_for_function(
                          "document.querySelector('#siteStatus')?.textContent?.includes('Choose a Sandsara')"
                      )
                      await page.set_input_files("#binInput", str(bin_path))
                      await page.wait_for_function(
                          "document.querySelector('#siteStatus')?.textContent?.includes('Decoded')",
                          timeout=30_000
                      )
                      if await page.locator("#statistics dd").count() < 5:
                          raise RuntimeError("The generated track was not visualised correctly.")

                      await page.set_viewport_size({"width": 390, "height": 844})
                      await page.goto(
                          f"http://127.0.0.1:{PORT}/index.html",
                          wait_until="networkidle"
                      )
                      await page.screenshot(path=str(BUILD / "site-mobile.png"), full_page=True)

                      if errors:
                          raise RuntimeError("\n".join(errors))

                      await browser.close()
              finally:
                  server.terminate()
                  server.wait(timeout=5)

          asyncio.run(run())
          PY

      - name: Package VS Code extension
        run: npm run package-extension

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandsara-build-log
          path: build.log
          if-no-files-found: error

      - name: Upload generated static site
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sandsara-static-site
          path: dist/site
          if-no-files-found: error

      - name: Upload browser validation screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sandsara-site-previews
          path: build/site-*.png
          if-no-files-found: error

      - name: Upload packaged VS Code extension
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sandsara-vsix
          path: "*.vsix"
          if-no-files-found: error
