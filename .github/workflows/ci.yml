name: Validate TypeScript builds

on:
  pull_request:
  push:
    branches-ignore:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        shell: bash
        run: |
          set +e
          npm run build:site > build.log 2>&1
          status=$?
          cat build.log
          exit "$status"

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandsara-build-log
          path: build.log
          if-no-files-found: error

      - name: Upload generated static site for inspection
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sandsara-static-site
          path: dist/site
          if-no-files-found: error
