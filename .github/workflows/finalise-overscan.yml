name: Finalise overscan implementation

on:
  push:
    branches:
      - agent/negative-circular-padding
    paths:
      - scripts/finalise-overscan.py
      - .github/workflows/finalise-overscan.yml

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final Overscan model
        run: python3 scripts/finalise-overscan.py
      - name: Install dependencies
        run: npm ci
      - name: Compile Baguette WASM, site and extension
        run: npm run compile
      - name: Package extension
        run: npm run package-extension
      - name: Remove one-shot files and commit validated source
        run: |
          rm scripts/finalise-overscan.py .github/workflows/finalise-overscan.yml
          git config user.name "Kitty Crow"
          git config user.email "141717449+kitty-crow@users.noreply.github.com"
          git add -A
          git commit -m "Add signed decimal overscan with circular clipping"
          git push origin HEAD:agent/negative-circular-padding
