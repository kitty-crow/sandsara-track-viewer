name: Finalise tracked overscan source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Write Overscan implementation directly into tracked source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/webview/svgToTrack.ts')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '''<label for="padding">Circular padding</label>
                <div class="control-row">
                  <input id="padding" type="range" min="-100" max="20" step="0.5" value="4">
                  <span id="paddingValue" class="value">4.0%</span>
                </div>
                <span class="hint">Negative values enlarge the artwork and trim anything outside the circular drawing area.</span>''':
              '''<label for="padding">Overscan</label>
                <div class="control-row">
                  <input id="padding" type="range" min="-1" max="1" step="0.01" value="-0.04">
                  <span id="paddingValue" class="value">-0.04</span>
                </div>
                <span class="hint">Positive values enlarge and crop the artwork. Negative values shrink it inside the circle.</span>''',
              'clamp(numberValue(padding, 4), -100, 20)': 'clamp(numberValue(padding, -0.04), -1, 1)',
              'paddingPercent: number': 'overscan: number',
              'const usableRadius = SANDSARA_RADIUS * (1 - paddingPercent / 100);': 'const usableRadius = SANDSARA_RADIUS * (1 + overscan);',
              '''return paddingPercent < 0
              ? clipPathsToCircle(fittedPaths, SANDSARA_RADIUS)
              : fittedPaths;''': '''return overscan > 0
              ? clipPathsToCircle(fittedPaths, SANDSARA_RADIUS)
              : fittedPaths;''',
          }
          for old, new in replacements.items():
              if new not in s:
                  if old not in s:
                      raise SystemExit(f'Missing source expression: {old}')
                  s = s.replace(old, new)
          old_display = '''`${numberValue(padding, 4).toFixed(1)}%`'''
          new_display = 'numberValue(padding, -0.04).toFixed(2)'
          if new_display not in s:
              if old_display not in s:
                  raise SystemExit('Missing padding display expression')
              s = s.replace(old_display, new_display)
          required = [
              '<label for="padding">Overscan</label>',
              'min="-1" max="1" step="0.01" value="-0.04"',
              'clamp(numberValue(padding, -0.04), -1, 1)',
              'overscan: number',
              'const usableRadius = SANDSARA_RADIUS * (1 + overscan);',
              'return overscan > 0',
              'numberValue(padding, -0.04).toFixed(2)',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing final markers: ' + ', '.join(missing))
          p.write_text(s, encoding='utf-8')
          PY
      - name: Install and validate complete build
        run: |
          npm ci --no-audit --no-fund
          npm run compile
          npm run package-extension
          test -s build/router-wasm/path-router.wasm
          test -s dist/webviews/path-router.wasm
          test -s dist/site/assets/webview/path-router.wasm
          test -s dist/site/index.html
          test -s dist/extension.js
      - name: Commit only permanent source and remove this workflow
        run: |
          rm .github/workflows/finalise-overscan.yml
          git config user.name 'Kitty Crow'
          git config user.email 'kitty-crow@users.noreply.github.com'
          git add src/webview/svgToTrack.ts .github/workflows/finalise-overscan.yml
          git commit -m 'Store overscan implementation directly in source'
          git push origin HEAD:main
