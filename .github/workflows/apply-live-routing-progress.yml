name: Apply live routing progress

on:
  push:
    branches:
      - agent/live-routing-progress
    paths:
      - "scripts/apply-live-routing-progress.py"

permissions:
  contents: write

jobs:
  apply-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-routing-progress
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply the live-progress implementation
        run: python3 scripts/apply-live-routing-progress.py

      - name: Refresh the lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Compile the website, extension and Baguette router
        run: npm run compile

      - name: Package the extension
        run: npm run package-extension

      - name: Commit the validated implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm scripts/apply-live-routing-progress.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Show live routing progress and preview"
          git push origin HEAD:agent/live-routing-progress
