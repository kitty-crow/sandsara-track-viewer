name: Consolidate merged preview fix

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  consolidate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Check out merged main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Delete merged branch, consolidate history and verify refs
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "Kitty Crow"
          git config user.email "kitty-crow@users.noreply.github.com"

          head_branch='${{ github.event.pull_request.head.ref }}'
          if [[ -n "$head_branch" && "$head_branch" != "main" ]]; then
            git push origin --delete "$head_branch" || true
          fi

          rm -f .github/workflows/finalise-preview-direction.yml
          rm -rf node_modules dist build
          rm -f sandsara-track-viewer-*.vsix

          git checkout --orphan consolidated-main
          git add -A
          git commit -m "Release Sandsara Track Viewer v0.3.6" -m "Consolidated release history:

          - 0.0.1 introduced native track decoding and preview.
          - 0.1.0 added raster vectorisation and SVG-to-track generation.
          - 0.2.0 added the client-side browser studio.
          - 0.3.0 introduced graph routing and the Baguette WebAssembly router.
          - 0.3.1 added the radial postman sweep.
          - 0.3.2 added worker progress and ETA reporting.
          - 0.3.3 added caching and resumable checkpoints.
          - 0.3.4 added decimal Overscan and circular clipping.
          - 0.3.5 added outside-in outer-ring routing with safe return retracing.
          - 0.3.6 makes live previews use the same outside-in direction as exported tracks."
          git branch -M main
          git push --force origin main

          while IFS= read -r branch; do
            if [[ -n "$branch" && "$branch" != "main" ]]; then
              git push origin --delete "$branch"
            fi
          done < <(
            git ls-remote --heads origin |
            awk '{sub("refs/heads/", "", $2); print $2}'
          )

          mapfile -t remaining < <(
            git ls-remote --heads origin |
            awk '{sub("refs/heads/", "", $2); print $2}'
          )

          if [[ "${#remaining[@]}" -ne 1 || "${remaining[0]}" != "main" ]]; then
            printf 'Unexpected remaining branch: %s\n' "${remaining[@]}" >&2
            exit 1
          fi
