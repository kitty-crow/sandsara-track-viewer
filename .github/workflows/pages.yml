name: Build and deploy Sandsara Track Studio

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build TypeScript site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build site
        run: npm run build:site

      - name: Verify generated site
        run: |
          test -f dist/site/index.html
          test -f dist/site/generator.html
          test -f dist/site/visualise.html
          test -f dist/site/about.html
          test -f dist/site/generator/index.html
          test -f dist/site/visualise/index.html
          test -f dist/site/about/index.html
          test -f dist/site/vectorise/index.html
          test -f dist/site/generate/index.html
          test -f dist/site/parts/img2svg.html
          test -f dist/site/parts/svg2bin.html
          test -f dist/site/assets/site/generator.js
          test -f dist/site/assets/site/embed.js
          test -f dist/site/assets/site/routes.js
          test -f dist/site/assets/site/visualise.js
          test -f dist/site/assets/site/trackCodecWasm.js
          test -f dist/site/assets/site/trackMarked.js
          test -f dist/site/assets/webview/rangeNumber.js
          test -f dist/site/assets/webview/trackAnimation.js
          test -f dist/site/assets/webview/autoSetup.js
          test -f dist/site/assets/webview/trackText.js
          test -f dist/site/assets/webview/track-codec.wasm
          test -f dist/webviews/rangeNumber.js
          test -f dist/webviews/trackAnimation.js
          test -f dist/webviews/autoSetup.js
          test -f dist/webviews/trackText.js
          test -f dist/webviews/track-codec.wasm
          test -f dist/trackEditorProvider.js
          test -f dist/site/styles.css
          test -f dist/site/track.css
          test -d dist/site/assets
          grep -q 'id="img2svg"' dist/site/generator/index.html
          grep -q 'id="svg2bin"' dist/site/generator/index.html
          grep -q '<base href="../">' dist/site/generator/index.html
          grep -q 'url=./generator#img2svg' dist/site/vectorise.html
          grep -q 'url=./generator#svg2bin' dist/site/generate.html
          grep -q 'src="./assets/site/routes.js"' dist/site/index.html
          grep -q 'cdn.jsdelivr.net/npm/marked@18.0.7/lib/marked.esm.js' dist/site/visualise.html
          grep -q 'decodeTrackWasm' dist/site/assets/site/visualise.js
          grep -q 'encodeTrackWasm' dist/site/assets/site/visualise.js
          grep -q 'cDecode' dist/site/assets/site/trackCodecWasm.js
          grep -q 'cEncode' dist/site/assets/site/trackCodecWasm.js
          grep -q '__SANDSARA_TRACK_MARKUP__' dist/site/assets/site/trackMarked.js
          grep -q 'id="sourceInput"' dist/site/assets/webview/trackPreview.js
          grep -q 'Save edited .bin' dist/site/assets/webview/trackPreview.js
          grep -q 'id="sourceInput"' dist/webviews/trackPreview.js
          grep -q 'Save edited .bin' dist/webviews/trackPreview.js
          grep -q 'EditableTrackEditor' dist/extension.js
          grep -q 'encodeTrack' dist/trackEditorProvider.js
          grep -q 'decodeTrack' dist/trackEditorProvider.js
          grep -q 'import "./rangeNumber.js"' dist/webviews/svgToTrack.js
          grep -q 'import "./trackAnimation.js"' dist/webviews/trackPreview.js
          grep -q 'import "./autoSetup.js"' dist/webviews/svgToTrack.js
          grep -q 'Custom circular canvas' dist/webviews/autoSetup.js
          grep -q 'Custom ball' dist/webviews/autoSetup.js
          grep -q 'id="autoEnabled"' dist/webviews/autoSetup.js
          grep -q 'id="minFeature"' dist/webviews/autoSetup.js
          grep -q 'id="pathLimit"' dist/webviews/autoSetup.js
          grep -q 'dataset.routingNote' dist/webviews/autoSetup.js
          grep -q 'notice.remove()' dist/webviews/autoSetup.js
          grep -q 'Auto turned off because you changed a physical track setting' dist/webviews/autoSetup.js
          grep -q '.auto-setup \[hidden\]' dist/webviews/autoSetup.js
          if grep -Rnw 'undefined' src/codec-wasm; then
            echo "The Baguette track codec contains undefined" >&2
            exit 1
          fi
          if grep -q '\bundefined\b' src/webview/autoSetup.ts; then
            echo "Track Auto crossed the Baguette-compatible boundary with undefined" >&2
            exit 1
          fi
          if grep -q 'import "./autoSetup.js"' dist/webviews/imageVectoriser.js; then
            echo "Image vectoriser still loads table and ball Auto setup" >&2
            exit 1
          fi
          if grep -q '"padding"' dist/webviews/autoSetup.js; then
            echo "Overscan is still governed by Auto" >&2
            exit 1
          fi
          if grep -q 'id="autoApply"' dist/webviews/autoSetup.js; then
            echo "Generated Auto setup still contains the obsolete Apply Auto button" >&2
            exit 1
          fi
          if grep -R 'class="privacy-note"' dist/site/index.html dist/site/generator.html dist/site/visualise.html dist/site/parts; then
            echo "Generated site still contains redundant privacy callouts" >&2
            exit 1
          fi
          if grep -E 'href="\./(index|vectorise|generate|generator|visualise|about)\.html"' dist/site/{index,generator,visualise,about}.html; then
            echo "Generated site still contains internal .html links" >&2
            exit 1
          fi

      - name: Package and verify VS Code extension
        run: |
          npm run package-extension
          vsix="$(find . -maxdepth 1 -name 'sandsara-track-viewer-*.vsix' -print -quit)"
          test -n "$vsix"
          unzip -l "$vsix" > /tmp/sandsara-vsix.txt
          grep -q 'extension/dist/extension.js' /tmp/sandsara-vsix.txt
          grep -q 'extension/dist/trackEditorProvider.js' /tmp/sandsara-vsix.txt
          grep -q 'extension/dist/webviews/trackPreview.js' /tmp/sandsara-vsix.txt
          grep -q 'extension/dist/webviews/trackText.js' /tmp/sandsara-vsix.txt
          grep -q 'extension/syntaxes/sandsara-track.tmLanguage.json' /tmp/sandsara-vsix.txt
          grep -q 'extension/language-configuration.json' /tmp/sandsara-vsix.txt
          if grep -q 'track-codec.wasm' /tmp/sandsara-vsix.txt; then
            echo "The VS Code package contains the browser-only WASM codec" >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload generated site
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
