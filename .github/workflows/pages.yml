name: Build and deploy Sandsara Track Studio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build TypeScript site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build site
        run: npm run build:site

      - name: Verify generated site
        run: |
          test -f dist/site/index.html
          test -f dist/site/vectorise.html
          test -f dist/site/generate.html
          test -f dist/site/visualise.html
          test -f dist/site/about.html
          test -f dist/site/favicon.svg
          test -f dist/site/styles.css
          test -f dist/site/theme.css
          test -f dist/site/studio-extra.css
          test -f dist/site/assets/site/theme.js
          test -f dist/site/assets/site/about.js
          test -f dist/site/assets/site/vectorise.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload generated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
