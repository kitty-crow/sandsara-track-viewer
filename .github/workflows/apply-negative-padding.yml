name: Apply negative circular padding

on:
  push:
    branches:
      - agent/negative-circular-padding
    paths:
      - "scripts/apply-negative-padding.py"
      - ".github/workflows/apply-negative-padding.yml"

permissions:
  contents: write

jobs:
  apply-build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/negative-circular-padding
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply signed padding and clipping
        run: python3 scripts/apply-negative-padding.py
      - name: Install dependencies
        run: npm ci
      - name: Compile website, extension and Baguette router
        run: npm run compile
      - name: Package extension
        run: npm run package-extension
      - name: Commit validated implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm scripts/apply-negative-padding.py
          git rm .github/workflows/apply-negative-padding.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Allow negative circular padding with clipping"
          git push origin HEAD:agent/negative-circular-padding
