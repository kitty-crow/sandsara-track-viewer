name: Validate path routing

on:
  pull_request:
    paths:
      - "src/webview/**"
      - "src/router-wasm/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/routing.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalise-wasm-build:
    if: github.head_ref == 'agent/baguette-wasm-router'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out router branch
        uses: actions/checkout@v4
        with:
          ref: agent/baguette-wasm-router
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Finalise and validate the shared WASM build
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 scripts/finalise-wasm-build.py
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run check
          npm run build:production
          npm run validate:router-wasm
          npm run package-extension

          test -s dist/webviews/path-router.wasm
          test -s dist/webviews/routerWorker.js
          test -s dist/site/assets/webview/path-router.wasm
          test -s dist/site/assets/webview/routerWorker.js

          git checkout HEAD -- .github/workflows
          git add package.json package-lock.json scripts/build.mts src/webview/routerWorkerClient.ts
          git commit -m "Make the Baguette WASM router build self-contained"
          git push origin HEAD:agent/baguette-wasm-router
