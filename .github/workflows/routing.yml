name: Validate path routing

on:
  pull_request:
    paths:
      - "src/webview/pathRouter.ts"
      - "src/webview/radialRouting.ts"
      - "src/webview/routeGraph.ts"
      - "src/webview/routePlanner.ts"
      - "src/webview/routingGeometry.ts"
      - "src/webview/svgToTrack.ts"
      - ".github/workflows/routing.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalise-wasm-build:
    if: github.head_ref == 'agent/baguette-wasm-router'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out router branch
        uses: actions/checkout@v4
        with:
          ref: agent/baguette-wasm-router
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make the Baguette build self-contained
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          import json
          from pathlib import Path

          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          package["devDependencies"].pop("@kitty-crow/baguette", None)
          package_path.write_text(json.dumps(package, indent=2) + "\n", encoding="utf-8")

          build_path = Path("scripts/build.mts")
          build = build_path.read_text(encoding="utf-8")
          build = build.replace(
              'const executable = process.platform === "win32" ? "npx.cmd" : "npx";\n',
              'const executable = process.platform === "win32" ? "npx.cmd" : "npx";\n'
              'const npmExecutable = process.platform === "win32" ? "npm.cmd" : "npm";\n',
              1,
          )
          build = build.replace(
              'await compileRouterWasm();\nawait copyStaticSite();',
              'await compileRouterWasm();\nvalidateRouterWasm();\nawait copyStaticSite();',
              1,
          )
          old = '''async function compileRouterWasm(): Promise<void> {
  try {
    await access(join("baguette", "src", "compiler.ts"));
  } catch {
    throw new Error(
      "The Baguette submodule is missing. Run git submodule update --init --recursive."
    );
  }

  const args = ['''
          new = '''async function compileRouterWasm(): Promise<void> {
  await ensureBaguetteToolchain();

  const args = ['''
          if old not in build:
              raise SystemExit("Could not locate compileRouterWasm preamble")
          build = build.replace(old, new, 1)
          insertion = '''
async function ensureBaguetteToolchain(): Promise<void> {
  try {
    await access(join("baguette", "src", "compiler.ts"));
  } catch {
    const update = spawnSync(
      "git",
      ["submodule", "update", "--init", "--recursive", "baguette"],
      { stdio: "inherit", shell: false }
    );
    if (update.error !== undefined) {
      throw update.error;
    }
    if (update.status !== 0) {
      throw new Error("Could not initialise the pinned Baguette submodule.");
    }
  }

  try {
    await access(join("baguette", "node_modules", "assemblyscript", "bin", "asc.js"));
    return;
  } catch {
    // Install the compiler's pinned dependencies inside the build-only submodule.
  }

  const install = spawnSync(
    npmExecutable,
    ["install", "--prefix", "baguette", "--no-package-lock", "--ignore-scripts"],
    { stdio: "inherit", shell: false }
  );
  if (install.error !== undefined) {
    throw install.error;
  }
  if (install.status !== 0) {
    throw new Error("Could not install Baguette's build dependencies.");
  }
}

function validateRouterWasm(): void {
  const result = spawnSync(
    process.execPath,
    [
      "--disable-warning=ExperimentalWarning",
      "--experimental-strip-types",
      join("scripts", "validate-router-wasm.mts")
    ],
    { stdio: "inherit", shell: false }
  );
  if (result.error !== undefined) {
    throw result.error;
  }
  if (result.status !== 0) {
    process.exit(result.status ?? 1);
  }
}

'''
          marker = 'async function copyRouterWasm(): Promise<void> {'
          if marker not in build:
              raise SystemExit("Could not locate copyRouterWasm")
          build = build.replace(marker, insertion + marker, 1)
          build_path.write_text(build, encoding="utf-8")

          client_path = Path("src/webview/routerWorkerClient.ts")
          client = client_path.read_text(encoding="utf-8")
          old_catch = '''  } catch {
    workerUnavailable = true;'''
          new_catch = '''  } catch (error: unknown) {
    console.error(
      "The WebAssembly router failed; using the slower TypeScript fallback.",
      error
    );
    workerUnavailable = true;'''
          if old_catch not in client:
              raise SystemExit("Could not locate the router fallback")
          client_path.write_text(client.replace(old_catch, new_catch, 1), encoding="utf-8")
          PY

          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run check
          npm run build:production
          npm run validate:router-wasm
          npm run package-extension

          test -s dist/webviews/path-router.wasm
          test -s dist/webviews/routerWorker.js
          test -s dist/site/assets/webview/path-router.wasm
          test -s dist/site/assets/webview/routerWorker.js

          git checkout HEAD -- .github/workflows
          git add package.json package-lock.json scripts/build.mts src/webview/routerWorkerClient.ts
          git commit -m "Make the Baguette WASM router build self-contained"
          git push origin HEAD:agent/baguette-wasm-router

  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build browser modules
        run: |
          npm ci
          npm run build:site

      - name: Verify persistent untouched and radial routing
        run: |
          node --input-type=module <<'JS'
          import { joinPathsByDrawingRoute } from "./dist/site/assets/webview/pathRouter.js";

          function line(a, b, count) {
            return Array.from({ length: count + 1 }, (_, index) => ({
              x: a.x + (b.x - a.x) * index / count,
              y: a.y + (b.y - a.y) * index / count
            }));
          }

          function closedSquare(cx, cy, half, count = 20) {
            const corners = [
              { x: cx + half, y: cy + half },
              { x: cx + half, y: cy - half },
              { x: cx - half, y: cy - half },
              { x: cx - half, y: cy + half },
              { x: cx + half, y: cy + half }
            ];
            return corners.slice(0, -1).flatMap((corner, index) => {
              const points = line(corner, corners[index + 1], count);
              return index === 0 ? points : points.slice(1);
            });
          }

          function closedCircle(cx, cy, radius, count = 180) {
            return Array.from({ length: count + 1 }, (_, index) => {
              const angle = Math.PI * 2 * index / count;
              return {
                x: cx + Math.cos(angle) * radius,
                y: cy + Math.sin(angle) * radius
              };
            });
          }

          function maximumStep(points) {
            let maximum = 0;
            for (let index = 1; index < points.length; index++) {
              maximum = Math.max(
                maximum,
                Math.hypot(
                  points[index].x - points[index - 1].x,
                  points[index].y - points[index - 1].y
                )
              );
            }
            return maximum;
          }

          function firstRadiusIndex(points, expectedRadius, tolerance = 0.3) {
            return points.findIndex(point =>
              Math.abs(Math.hypot(point.x, point.y) - expectedRadius) <= tolerance
            );
          }

          const largeSquare = closedSquare(0, 0, 10);
          const nearbySquare = closedSquare(-14, 0, 1);
          const reused = joinPathsByDrawingRoute([largeSquare, nearbySquare], 30);
          if (reused.connectorCount !== 1 || maximumStep(reused.points) >= 4) {
            throw new Error("The router did not return over completed nearby geometry.");
          }

          const rightCircle = closedCircle(20, 0, 2);
          const leftCircle = closedCircle(-20, 0, 2);
          const edged = joinPathsByDrawingRoute([rightCircle, leftCircle], 25);
          if (maximumStep(edged.points) >= 4) {
            throw new Error("The router crossed the artwork instead of using the outer edge.");
          }
          const minimumRadius = Math.min(...edged.points.map(point => Math.hypot(point.x, point.y)));
          if (minimumRadius <= 17.5) {
            throw new Error("The outer-edge route entered the centre of the artwork.");
          }

          const frame = closedSquare(0, 0, 25, 50);
          const frameLeft = closedCircle(-22, 0, 2, 90);
          const frameRight = closedCircle(22, 0, 2, 90);
          const persistent = joinPathsByDrawingRoute([frame, frameLeft, frameRight], 30);
          if (persistent.crossingCount !== 0) {
            throw new Error("The router crossed untouched geometry in the persistent-frame case.");
          }
          if (persistent.newConnectorDistance >= 8) {
            throw new Error(
              `The router forgot the completed frame and drew ${persistent.newConnectorDistance.toFixed(2)} units of new connectors.`
            );
          }

          const enclosingFrame = closedSquare(0, 0, 30, 60);
          const enclosingContour = closedCircle(0, 0, 15, 180);
          const innerContour = closedCircle(0, 0, 2, 90);
          const nested = joinPathsByDrawingRoute(
            [enclosingFrame, innerContour, enclosingContour],
            35
          );
          if (nested.crossingCount !== 0) {
            throw new Error("The router cut through an untouched enclosing contour.");
          }

          const innerBand = closedCircle(0, 0, 4, 120);
          const middleBand = closedCircle(0, 0, 12, 160);
          const outerBand = closedCircle(0, 0, 22, 220);
          const radial = joinPathsByDrawingRoute(
            [outerBand, innerBand, middleBand],
            30,
            false
          );
          const innerIndex = firstRadiusIndex(radial.points, 4);
          const middleIndex = firstRadiusIndex(radial.points, 12);
          const outerIndex = firstRadiusIndex(radial.points, 22);
          if (innerIndex < 0 || middleIndex < 0 || outerIndex < 0 ||
              !(innerIndex < middleIndex && middleIndex < outerIndex)) {
            throw new Error(
              `The router did not progress inside-to-outside: ${innerIndex}, ${middleIndex}, ${outerIndex}.`
            );
          }
          JS
