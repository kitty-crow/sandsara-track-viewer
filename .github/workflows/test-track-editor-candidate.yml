name: Test track editor candidate

on:
  pull_request:
    branches:
      - test/editor-base-v2

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build web and extension targets
        run: npm run build:site
      - name: Package extension
        run: npm run package-extension
      - name: Build and smoke-test manual packages
        run: |
          set -Eeuo pipefail
          rm -rf test-package test-artifacts
          mkdir -p test-package/public test-artifacts
          cp -a dist/site/. test-package/public/
          cat > test-package/serve.mjs <<'NODE'
          import { createReadStream } from 'node:fs';
          import { stat } from 'node:fs/promises';
          import { createServer } from 'node:http';
          import { extname, join, resolve, sep } from 'node:path';
          import { fileURLToPath } from 'node:url';
          const root = resolve(fileURLToPath(new URL('.', import.meta.url)), 'public');
          const host = process.env.HOST ?? '127.0.0.1';
          const port = Number(process.env.PORT ?? '4173');
          const routes = new Map([['/','index.html'],['/generator','generator.html'],['/visualise','visualise.html'],['/about','about.html'],['/vectorise','vectorise.html'],['/generate','generate.html']]);
          const types = new Map([['.css','text/css; charset=utf-8'],['.html','text/html; charset=utf-8'],['.js','text/javascript; charset=utf-8'],['.json','application/json; charset=utf-8'],['.png','image/png'],['.svg','image/svg+xml'],['.wasm','application/wasm']]);
          createServer(async (req,res) => {
            try {
              const url = new URL(req.url ?? '/', `http://${req.headers.host ?? host}`);
              const route = url.pathname.length > 1 ? url.pathname.replace(/\/+$/, '') : url.pathname;
              const rel = routes.get(route) ?? decodeURIComponent(route).replace(/^\/+/, '');
              let target = resolve(root, rel || 'index.html');
              if (target !== root && !target.startsWith(`${root}${sep}`)) throw new Error('Invalid path');
              let info = await stat(target);
              if (info.isDirectory()) { target = join(target,'index.html'); info = await stat(target); }
              res.writeHead(200, {'Cache-Control':'no-store','Content-Length':info.size,'Content-Type':types.get(extname(target)) ?? 'application/octet-stream'});
              createReadStream(target).pipe(res);
            } catch {
              res.writeHead(404, {'Content-Type':'text/plain; charset=utf-8'});
              res.end('Not found\n');
            }
          }).listen(port, host, () => console.log(`Preview: http://${host}:${port}/visualise`));
          NODE
          cat > test-package/run-preview.sh <<'SH'
          #!/usr/bin/env sh
          set -eu
          cd "$(dirname "$0")"
          exec node ./serve.mjs
          SH
          chmod +x test-package/run-preview.sh
          HOST=127.0.0.1 PORT=4174 node test-package/serve.mjs >/tmp/sandsara-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for path in / /generator /visualise /visualise/ /about /vectorise /generate /assets/webview/editorActions.js /assets/webview/track-codec.wasm; do
            curl --fail --silent --show-error "http://127.0.0.1:4174$path" >/dev/null
          done
          kill "$server_pid"
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT
          tar -czf test-artifacts/sandsara-bin-editor-preview.tar.gz -C test-package .
          cp "$(find . -maxdepth 1 -name 'sandsara-track-viewer-*.vsix' -print -quit)" test-artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: track-editor-candidate-packages
          path: test-artifacts
          retention-days: 7
