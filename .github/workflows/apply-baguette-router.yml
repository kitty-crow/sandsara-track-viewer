name: Apply shared Baguette WASM router

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-baguette-router.yml"
      - "build-support/router-payload-*.b64"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/baguette-wasm-router'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          ref: agent/baguette-wasm-router
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply and validate shared WASM router
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/baguette-router-bootstrap.log) 2>&1

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cat build-support/router-payload-0{0..4}.b64 |
            base64 --decode > /tmp/sandsara-wasm-router.tar.gz
          tar -xzf /tmp/sandsara-wasm-router.tar.gz -C .
          python3 build-support/apply.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          router = Path("src/router-wasm/router.ts")
          text = router.read_text(encoding="utf-8")
          text = text.replace(
              "  return Math.ceil(value);",
              "  return Math.ceil(value) as I32;",
          ).replace(
              "  return Math.floor(value);",
              "  return Math.floor(value) as I32;",
          )
          router.write_text(text, encoding="utf-8")

          config_path = Path("baguette.router.config.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          config["allowedHostImports"] = [
              {"module": "env", "name": "abort", "kind": "function"}
          ]
          config["abi"]["allowNonFunctionExports"] = True
          config_path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")

          old = "WebAssembly.instantiate(bytes, {});"
          new = '''WebAssembly.instantiate(bytes, {
              env: {
                abort: (_message: number, _filename: number, line: number, column: number): never => {
                  throw new Error(`The WebAssembly router aborted at ${line}:${column}.`);
                }
              }
            });'''
          for filename in [
              "src/webview/routerWorker.ts",
              "scripts/validate-router-wasm.mts",
          ]:
              path = Path(filename)
              source = path.read_text(encoding="utf-8")
              if old not in source:
                  raise SystemExit(f"Missing WebAssembly instantiate call in {filename}")
              path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run check
          npm run build:production
          npm run validate:router-wasm

          test -s dist/webviews/path-router.wasm
          test -s dist/webviews/routerWorker.js
          test -s dist/site/assets/webview/path-router.wasm
          test -s dist/site/assets/webview/routerWorker.js

          rm -rf build-support
          rm -f .github/workflows/apply-baguette-router.yml
          git add -A
          git commit -m "Compile the shared path router to WebAssembly with Baguette"
          git push origin HEAD:agent/baguette-wasm-router

      - name: Upload bootstrap compiler log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: baguette-router-bootstrap-log
          path: /tmp/baguette-router-bootstrap.log
          if-no-files-found: error
