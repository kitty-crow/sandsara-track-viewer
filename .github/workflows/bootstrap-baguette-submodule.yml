name: Bootstrap Baguette submodule

on:
  push:
    branches:
      - agent/baguette-wasm-router
    paths:
      - ".github/workflows/bootstrap-baguette-submodule.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/baguette-wasm-router
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add pinned Baguette submodule
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f .github/workflows/bootstrap-baguette-submodule.yml

          if [[ ! -f .gitmodules ]] || ! grep -q 'path = baguette' .gitmodules; then
            git submodule add https://github.com/kitty-crow/baguette.git baguette
          fi

          git -C baguette fetch origin
          git -C baguette checkout 1b7eb13644a7ed80f538a7dc37988654f24d7ce4

          git add .gitmodules baguette .github/workflows/bootstrap-baguette-submodule.yml
          git commit -m "Add Baguette as a pinned build submodule"
          git push origin HEAD:agent/baguette-wasm-router
