name: TypeScript worker branch check

on:
  push:
    branches:
      - fix/vscode-typescript-worker

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run compile

      - name: Verify TypeScript worker bundle
        run: |
          test -s dist/webviews/routerTsWorker.js
          grep -q '__req("./routerTsWorker")' dist/webviews/routerTsWorker.js
          if grep -Eq '(^|[[:space:]])import[[:space:]]|import\(' dist/webviews/routerTsWorker.js; then
            echo 'Bundled worker still contains an import.' >&2
            exit 1
          fi

      - name: Package extension
        run: npm run package-extension

      - name: Verify VSIX contents
        run: |
          VSIX="$(find . -maxdepth 1 -type f -name '*.vsix' -print -quit)"
          test -n "$VSIX"
          unzip -l "$VSIX" | grep -q 'extension/dist/webviews/routerTsWorker.js'
